name: Build
on:
  push: { branches: [main, master], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shader-torches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shadertorches-jar
          path: |
            shader-torches/build/libs/*.jar
            !shader-torches/build/libs/*-sources.jar
  release:   # runs when you push a tag like v1.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: shadertorches-jar, path: dist }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*.jar, generate_release_notes: true }
